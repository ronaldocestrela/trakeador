services:
  trakeador-web:
    build:
      context: ./TrakeadorWeb
      dockerfile: Dockerfile
    container_name: trakeador-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8580
    volumes:
      - trakeador-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  trakeador-data: